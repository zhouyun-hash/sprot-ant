# 蚁数智动智慧体育平台 — 主配置（数据以 PC 管理端为权威源，多端通过 API 实时同步）
spring:
  application:
    name: ant-sports-server
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    context-path: /

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:smart_sports}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 第三方 AI（百度 / 阿里云 / 商汤等）密钥仅从环境变量或配置中心注入，禁止硬编码入库
ai:
  provider: baidu
  baidu:
    api-key: ${BAIDU_AI_API_KEY:}
    secret: ${BAIDU_AI_SECRET:}

# 视频：FFmpeg 可执行文件路径（Docker 内通常为 /usr/bin/ffmpeg）
video:
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
